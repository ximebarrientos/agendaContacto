<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Practica de operaciones del CRUD con una agenda"
    />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <meta name="author" content="Claudia Ximena Barrientos" />
    <title>Agenda de contactos</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-secondary">
        <div class="container">
          <a class="navbar-brand" href="./index.html">Agenda de contacto</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="./index.html"
                  >Inicio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./pages/error404.html">Contacto</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main class="container my-4">
      <div class="d-flex justify-content-between">
        <h1>Lista de contactos</h1>
        <button
          class="btn btn-primary" id="btnAgregarContacto"
        >
          <i class="bi bi-plus-circle"></i> Agregar
        </button>
      </div>
      <!-- todo corregir el diseño para que sea responsive -->
      <section class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Nombre</th>
              <th scope="col">Apellido</th>
              <th scope="col">Tel.</th>
              <th scope="col">Email</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaContacto">
            
          </tbody>
        </table>
      </section>
    </main>
    <!-- modal crear contacto -->
    <div
      class="modal fade"
      id="crearContacto"
      tabindex="-1"
      aria-labelledby="modalCrearContacto"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="modalCrearContacto">
              Agregar contactos
            </h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="nombre" class="form-label"
                  >Nombre</label
                >
                <input
                  type="nombre"
                  class="form-control"
                  id="nombre"
                  aria-describedby="ingresar nombre"
                  minlenght="2" maxlength="50" placeholder="Ej: Juan"
                />
              </div>
              <div class="mb-3">
                <label for="apellido" class="form-label"
                  >Apellido</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="apellido"
                  minlength="2" maxlength="50" placeholder="Ej: Perez"
                />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label"
                  >Email</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  minlength="2" maxlength="50"
                  placeholder="Ej: juanperez@gmail.com"
                />
              </div>
              <div class="mb-3">
                <label for="telefono" class="form-label"
                  >Teléfono</label
                >
                <input
                  type="tel"
                  class="form-control"
                  id="telefono"
                  minlength="2" maxlength="20"
                  placeholder="Ej: +5491234567"
                />
              </div>
              <div class="mb-3">
                <label for="imagen" class="form-label"
                  >Imagen</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="imagen"
                  minlength="2" maxlength="20"
                  placeholder="Ej: http://image"
                />
              <div class="mb-3">
                <label for="notas" class="form-label"
                  >Notas</label
                >
                <textarea
                  class="form-control"
                  id="notas"
                  placeholder="Agrega tus notas aquí" maxlength="250"
                ></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <footer class="bg-secondary-subtle text-center py-4 text-dark">
      <p>&copy; Todos los derechos reservados</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
    <script src="./js/app.js" type="module"></script>
  </body>
</html>
